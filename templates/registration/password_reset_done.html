{% extends 'base.html' %}
{% load static %}
{% block title %}Email Sent - HRM System{% endblock %}
{% block full_content %}
<div class="login-page">
    <div class="login-container">
        <div class="login-card" style="text-align:center;">
            <div class="login-logo" style="background:var(--success);"><i class="ri-mail-send-line"></i></div>
            <h3>Check Your Email</h3>
            <p style="margin-top:12px;">We've sent password reset instructions to your email.</p>
            <a href="{% url 'login' %}" class="btn btn-primary" style="margin-top:16px;">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
